<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title description">
<title id="title">Lab 8 GPIO wiring diagram</title>
<desc id="description">UART GPIO17 TX joins GPIO16 RX. SPI GPIO23 MOSI joins GPIO19 MISO; GPIO18 SCK and GPIO27 CS have no external connections. ESP32 GPIO21 joins OLED SDA, GPIO22 joins SCL, 3V3 joins VCC, and GND joins GND.</desc>
<rect width="1200" height="780" fill="#f4f6f8"/>
<g font-family="Arial, sans-serif" fill="#172735">
<text x="25" y="48" font-size="34" font-weight="bold">Lab 8: GPIO connections</text>
<text x="25" y="81" font-size="20">Lines show jumpers or module connections, not physical pin positions.</text>
<rect x="20" y="105" width="560" height="270" rx="14" fill="white" stroke="#cbd5df" stroke-width="2"/>
<text x="45" y="145" font-size="27" font-weight="bold">UART loopback</text>
<rect x="60" y="175" width="230" height="140" rx="10" fill="#eaf0f5" stroke="#aabaca"/>
<text x="80" y="205" font-size="21" font-weight="bold">ESP32</text>
<text x="80" y="244" font-size="23">GPIO17 - TX</text>
<text x="80" y="292" font-size="23">GPIO16 - RX</text>
<path d="M290 236 H500 V284 H290" fill="none" stroke="#9b3b86" stroke-width="6"/>
<circle cx="290" cy="236" r="6" fill="#9b3b86"/><circle cx="290" cy="284" r="6" fill="#9b3b86"/>
<text x="330" y="215" font-size="20">Loopback jumper</text>
<text x="60" y="350" font-size="19">TX and RX are joined on the same ESP32.</text>
<rect x="600" y="105" width="580" height="270" rx="14" fill="white" stroke="#cbd5df" stroke-width="2"/>
<text x="625" y="145" font-size="27" font-weight="bold">SPI loopback</text>
<rect x="640" y="175" width="250" height="140" rx="10" fill="#eaf0f5" stroke="#aabaca"/>
<text x="660" y="205" font-size="21" font-weight="bold">ESP32</text>
<text x="660" y="244" font-size="23">GPIO23 - MOSI</text>
<text x="660" y="292" font-size="23">GPIO19 - MISO</text>
<path d="M890 236 H1115 V284 H890" fill="none" stroke="#b75c1b" stroke-width="6"/>
<circle cx="890" cy="236" r="6" fill="#b75c1b"/><circle cx="890" cy="284" r="6" fill="#b75c1b"/>
<text x="925" y="215" font-size="20">Loopback jumper</text>
<text x="640" y="342" font-size="19">GPIO18 (SCK) and GPIO27 (CS):</text>
<text x="640" y="365" font-size="19">configured in the sketch; no external wires.</text>
<rect x="20" y="395" width="1160" height="365" rx="14" fill="white" stroke="#cbd5df" stroke-width="2"/>
<text x="45" y="438" font-size="27" font-weight="bold">I2C OLED</text>
<rect x="60" y="465" width="300" height="235" rx="10" fill="#eaf0f5" stroke="#aabaca"/>
<rect x="840" y="465" width="300" height="235" rx="10" fill="#e7f2f0" stroke="#8fb4ac"/>
<text x="85" y="495" font-size="22" font-weight="bold">ESP32</text>
<text x="865" y="495" font-size="22" font-weight="bold">I2C OLED module</text>
<text x="85" y="535" font-size="23">GPIO21 - SDA</text><text x="865" y="535" font-size="23">SDA</text>
<text x="85" y="583" font-size="23">GPIO22 - SCL</text><text x="865" y="583" font-size="23">SCL</text>
<text x="85" y="631" font-size="23">3V3</text><text x="865" y="631" font-size="23">VCC</text>
<text x="85" y="679" font-size="23">GND</text><text x="865" y="679" font-size="23">GND</text>
<path d="M360 527 H840" stroke="#177b8c" stroke-width="6"/><path d="M360 575 H840" stroke="#2767b5" stroke-width="6"/>
<path d="M360 623 H840" stroke="#c5363c" stroke-width="6"/><path d="M360 671 H840" stroke="#414c55" stroke-width="6"/>
<text x="60" y="735" font-size="19">Connections are labeled by signal; the OLED's physical pin order can vary.</text>
</g></svg>